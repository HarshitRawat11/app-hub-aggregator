[project]
name = "aggregator"
version = "0.1.0"
description = "Probes every catalogued link and reports what is actually up"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=2.12.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
# Same as the other two services: puts aggregator/ on sys.path so
# `from app.main import app` resolves. Without it the failure reads like a
# broken install rather than a path problem.
pythonpath = ["."]
testpaths = ["tests"]
# probe.py's functions are async and worth testing directly rather than only
# through HTTP -- the SSRF guard and the concurrency behaviour are the two
# things most worth pinning down, and neither needs a request to exercise.
asyncio_mode = "auto"
